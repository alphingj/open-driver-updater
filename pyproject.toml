[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-driver-updater"
version = "0.2.0"
description = "100% free open driver updater for Windows (x86/x64/ARM64)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
odu = "odu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
